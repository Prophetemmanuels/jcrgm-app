<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCRGM Member Directory</title>

<link href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>
<script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; }
.container { max-width:1200px; margin:auto; padding:20px; }
.hidden{ display:none; }
.login-box{ max-width:300px; margin:100px auto; background:#fff; padding:20px; border-radius:10px; text-align:center; }
input{ width:100%; padding:10px; margin-top:10px; }
button{ padding:10px; margin-top:10px; cursor:pointer; }
.members-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
.member-card{ background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.1);} 
.member-photo{ width:100%; height:250px; object-fit:cover; }
.member-info{ padding:10px; }
.viewer-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:15px; }
.viewer-card{ background:#fff; padding:10px; border-radius:8px; text-align:center; }
.viewer-card img{ width:100%; height:150px; object-fit:cover; border-radius:6px; }
#cropModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;flex-direction:column; z-index:1000;}
#cropModal img{max-width:300px; max-height:400px;}
#cropModal.hidden{ display:none; }
</style>
</head>
<body>

<div id="login" class="login-box">
<h3>Admin Login</h3>
<input type="password" id="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
<button onclick="openViewer()">👀 View Members</button>
<p id="loginError" style="color:red; display:none;">Incorrect Password</p>
</div>

<div id="app" class="container hidden">
<h1>JCRGM Members</h1>
<input type="text" id="name" placeholder="Name">
<input type="text" id="phone" placeholder="Phone">
<input type="text" id="address" placeholder="Address">
<input type="text" id="nrc" placeholder="NRC">
<input type="file" id="photoInput">
<button onclick="addMember()">Add</button>
<div id="members" class="members-grid"></div>
</div>

<div id="viewer" class="container hidden">
<h2>Members Directory</h2>
<div id="viewerList" class="viewer-grid"></div>
</div>

<div id="cropModal" class="hidden">
<img id="cropImage">
<div style="margin-top:10px;">
<button id="applyCropBtn">Apply Crop</button>
<button onclick="cancelCrop()">Cancel</button>
</div>
</div>

<script>
let members = [];
let cropper, croppedImage='', currentID=null;
const photoInput = document.getElementById('photoInput');
const applyCropBtn = document.getElementById('applyCropBtn');
photoInput.addEventListener('change', openCropper);
applyCropBtn.addEventListener('click', applyCrop);

async function fetchMembers(){
  try{
    const res = await fetch('https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO/members.json');
    members = await res.json();
    display(); displayViewer();
  }catch(e){ console.log('Could not fetch members',e); }
}

function login(){
 const pw = document.getElementById('password').value;
 if(pw === '1234'){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('loginError').style.display = 'none';
 }
 else { document.getElementById('loginError').style.display = 'block'; }
}

function openViewer(){
 document.getElementById('login').classList.add('hidden');
 document.getElementById('viewer').classList.remove('hidden');
 fetchMembers();
}

function save(){
  // For admin: optionally update localStorage or JSON for GitHub update workflow
  localStorage.setItem('members',JSON.stringify(members));
  display(); displayViewer();
}

function openCropper(e){
 const file = e.target.files[0];
 if(!file) return;
 const reader = new FileReader();
 reader.onload = (ev)=>{
  document.getElementById('cropModal').classList.remove('hidden');
  let img = document.getElementById('cropImage');
  img.src = ev.target.result;
  if(cropper) cropper.destroy();
  cropper = new Cropper(img, { aspectRatio: 3/4 });
 }
 reader.readAsDataURL(file);
}

function applyCrop(){
 if(!cropper) return;
 const canvas = cropper.getCroppedCanvas();
 if(currentID){
  let m = members.find(x=>x.id===currentID);
  m.photo = canvas.toDataURL();
 } else {
  croppedImage = canvas.toDataURL();
 }
 cropper.destroy(); cropper=null;
 document.getElementById('cropModal').classList.add('hidden');
 currentID=null;
 display(); displayViewer();
}

function cancelCrop(){
 if(cropper){ cropper.destroy(); cropper=null; }
 document.getElementById('cropModal').classList.add('hidden');
 currentID=null;
}

function addMember(){
 const nameVal = document.getElementById('name').value || 'No Name';
 const phoneVal = document.getElementById('phone').value || 'No Phone';
 const addressVal = document.getElementById('address').value || 'No Address';
 const nrcVal = document.getElementById('nrc').value || 'N/A';
 let m = { id: Date.now(), name: nameVal, phone: phoneVal, address: addressVal, nrc: nrcVal, photo: croppedImage || 'https://via.placeholder.com/300x400' };
 members.push(m);
 croppedImage=''; photoInput.value='';
 save();
}

function display(){
 let c=document.getElementById('members'); c.innerHTML='';
 members.forEach(m=>{
  c.innerHTML+=`<div class='member-card'><img src='${m.photo}' class='member-photo'><div class='member-info'><b>${m.name}</b><br><a href='tel:${m.phone}'>${m.phone}</a><br><button onclick='changePhoto(${m.id})'>Change Photo</button></div></div>`;
 });
}

function changePhoto(id){
 currentID=id;
 photoInput.click();
}

function displayViewer(){
 let v=document.getElementById('viewerList'); v.innerHTML='';
 members.forEach(m=>{
  v.innerHTML+=`<div class='viewer-card'><img src='${m.photo}'><div>${m.name}</div></div>`;
 });
}

display();
</script>
</body>
</html>
