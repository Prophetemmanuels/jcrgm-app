<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Members Gallery</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .member-card {
    text-align: center;
  }

  .member-card img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .member-card img:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  .member-name {
    margin-top: 6px;
    font-weight: bold;
    color: #1f3c88;
    font-size: 14px;
  }

  @media (max-width: 600px) {
    .gallery {
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    }
  }
</style>
</head>
<body>

<h1>Church Members</h1>
<div class="gallery" id="gallery"></div>

<script>
  // Array of member images and their names
  const members = [
    { src: "member (1).jpg", name: "Emmanuel Sakala" },
    { src: "member (2).jpg", name: "Vivien Sakala" }
    // Add more members here as you upload images
  ];

  const gallery = document.getElementById('gallery');

  members.forEach(member => {
    const card = document.createElement('div');
    card.className = 'member-card';

    const img = document.createElement('img');
    img.src = `images/${member.src}`;
    img.alt = member.name;

    const name = document.createElement('div');
    name.className = 'member-name';
    name.innerText = member.name;

    card.appendChild(img);
    card.appendChild(name);
    gallery.appendChild(card);
  });
</script>

</body>
</html>
