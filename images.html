<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Members Gallery</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .member-card {
    text-align: center;
  }

  /* Fixed size for all images */
  .member-card img {
    width: 150px;       /* fixed width */
    height: 150px;      /* fixed height */
    border-radius: 10px;
    object-fit: cover;   /* crop to fill box while keeping aspect */
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .member-card img:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  .member-name {
    margin-top: 6px;
    font-weight: bold;
    color: #1f3c88;
    font-size: 14px;
  }

  @media (max-width: 600px) {
    .member-card img {
      width: 100px;
      height: 100px;
    }
  }
</style>
</head>
<body>

<h1>Church Members</h1>
  <div style="text-align:center; margin-top:15px;">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="Search member name..." 
    style="padding:8px; width:200px; border-radius:5px; border:1px solid #ccc;"
  >
  
  <button onclick="searchMembers()" 
    style="padding:8px 12px; border:none; background:#1f3c88; color:white; border-radius:5px; cursor:pointer;">
    Search
  </button>
</div>
<div class="gallery" id="gallery"></div>

<script>
  const extensions = ["jpg", "jpeg", "png", "webp"];

  const members = [
    { id: 1, name: "Emmanuel Sakala" },
    { id: 2, name: "Vivien Sakala" },
    { id: 3, name: "Esther Mukobeka" },
    { id: 4, name: "Serah Nalavwe" },
    { id: 5, name: "Angela Chanda" },
    { id: 6, name: "Mercy Nalavwe" },
    { id: 7, name: "Fostina Mwanza" },
    { id: 8, name: "Patrick Daka" },
    { id: 9, name: "Andrew Mukobeka Jnr" },
    { id: 10, name: "Exildah Mwala" },
    { id: 11, name: "Hope Miyoba" },
    { id: 12, name: "Blessings Chewetu" },
    { id: 13, name: "Maria Kumwenda" },
    { id: 14, name: "Veronica Nyimbili" },
    { id: 15, name: "Racheal Nkhata" },
    { id: 16, name: "Andrew Mukobeka" },
    { id: 17, name: "Gracious Mubanga" },
    { id: 18, name: "Yvonne Chimika" },
    { id: 19, name: "Florence Chileshe" },
    { id: 20, name: "Ruth Lungu" },
    { id: 21, name: "Grace Chewe" },
    { id: 22, name: "Ngosa Nakazwe" },
    { id: 23, name: "Daka Paul" },
    { id: 24, name: "Loveness Sakala" },
    { id: 25, name: "Mathews Phiri" },
    { id: 26, name: "Phiri Hellen" },
    { id: 27, name: "Mike Lungu" },
    { id: 28, name: "Mapalo Darlington" },
    { id: 29, name: "Haggai Mbewe" },
    { id: 30, name: "Purity Chileshe" },
    { id: 31, name: "Immanuel Mwanza" },
    { id: 32, name: "" },
    { id: 33, name: "" },
    { id: 34, name: "" }
  ];

  const gallery = document.getElementById('gallery');

  function loadImage(img, baseName) {
    let index = 0;

    function tryNext() {
      if (index >= extensions.length) {
        img.src = "images/default.png";
        return;
      }

      const testSrc = `images/${baseName}.${extensions[index]}`;
      const testImg = new Image();

      testImg.onload = function () {
        img.src = testSrc;
      };

      testImg.onerror = function () {
        index++;
        tryNext();
      };

      testImg.src = testSrc;
    }

    tryNext();
  }

  // 🔥 Render function (important for search)
  function renderMembers(list) {
    gallery.innerHTML = "";

    list.forEach(member => {
      const card = document.createElement('div');
      card.className = 'member-card';

      const img = document.createElement('img');
      const baseName = `member (${member.id})`;

      loadImage(img, baseName);

      const name = document.createElement('div');
      name.className = 'member-name';
      name.innerText = member.name;

      card.appendChild(img);
      card.appendChild(name);
      gallery.appendChild(card);
    });
  }

  // 🔍 Search function
  function searchMembers() {
    const input = document.getElementById("searchInput").value.toLowerCase();

    const filtered = members.filter(member =>
      member.name.toLowerCase().includes(input)
    );

    renderMembers(filtered);
  }

  // 🔥 Initial load
  renderMembers(members);
</script>

</body>
</html>
